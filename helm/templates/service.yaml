apiVersion: v1
kind: Service
metadata:
  name: events-backend-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: ng-events-backend
spec:
  type: ClusterIP
  selector:
    app: ng-events-backend
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}